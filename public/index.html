<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Mail Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="password-gate" class="password-gate">
    <div class="gate-card">
      <div class="gate-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2>Access Protected</h2>
      <p>Enter passkey to access console</p>
      <input type="password" id="site-password" placeholder="Passkey">
      <button id="login-btn"><i class="fa-solid fa-key"></i> Unlock</button>
      <div id="gate-error" class="error-msg"></div>
    </div>
  </div>

  <div id="app-container" class="app-container hidden">
    <header class="header">
      <div class="logo">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Secure Mail Console</span>
      </div>
      <button id="logout-btn" class="btn-secondary"><i class="fa-solid fa-right-from-bracket"></i> Lock</button>
    </header>

    <main class="dashboard">
      <div class="card">
        <h3><i class="fa-solid fa-server"></i> SMTP Settings</h3>
        <div class="form-group">
          <label>Sender Email</label>
          <input type="email" id="smtp-email" placeholder="you@gmail.com">
        </div>
        <div class="form-group">
          <label>App Password (16 chars)</label>
          <input type="password" id="smtp-pass" placeholder="xxxx xxxx xxxx xxxx">
        </div>
        <div class="form-group">
          <label>Sender Name</label>
          <input type="text" id="sender-name" placeholder="John Doe">
        </div>
        <button id="verify-btn" class="btn-primary"><i class="fa-solid fa-plug"></i> Test Connection</button>
        <div id="smtp-status" class="status-msg"></div>
      </div>

      <div class="card">
        <h3><i class="fa-solid fa-envelope"></i> Campaign Setup</h3>
        <div class="form-group">
          <label>Subject (Supports Spintax)</label>
          <input type="text" id="email-subject" placeholder="{Quick note|Website query}">
        </div>
        <div class="form-group">
          <label>Message Body / Template Deck</label>
          <textarea id="email-body" rows="6" placeholder="Hi {Name},&#10;&#10;{Check out your site|Quick site audit offer}."></textarea>
        </div>
        <div class="form-group">
          <label>Recipients (One per line or CSV: email, name)</label>
          <textarea id="email-recipients" rows="6" placeholder="test@example.com, John"></textarea>
        </div>
        <div class="actions">
          <button id="send-btn" class="btn-success"><i class="fa-solid fa-rocket"></i> Start Dispatch</button>
          <button id="stop-btn" class="btn-danger" disabled><i class="fa-solid fa-stop"></i> Stop</button>
        </div>
      </div>

      <div class="card full-width">
        <h3><i class="fa-solid fa-list-check"></i> Live Dispatch Logs</h3>
        <div id="log-console" class="log-console"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
